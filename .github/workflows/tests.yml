name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vitest:
    name: Vitest (mode deep links + suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Run tests with coverage
        run: bun run test:ci

      - name: Check out base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-branch

      - name: Base branch coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base-branch
        run: |
          bun install --frozen-lockfile
          bun run test:ci || true

      - name: Collect base coverage summary
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p coverage-base
          if [ -f base-branch/coverage/coverage-summary.json ]; then
            cp base-branch/coverage/coverage-summary.json coverage-base/coverage-summary.json
          fi

      - name: Build coverage diff
        if: always()
        run: node scripts/coverage-diff.mjs ./coverage/coverage-summary.json ./coverage-base/coverage-summary.json ./coverage-diff.md

      - name: Post coverage diff comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-diff
          path: ./coverage-diff.md

      - name: Coverage summary on the pull request
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Coverage
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          json-summary-compare-path: ./coverage-base/coverage-summary.json
          file-coverage-mode: changes



      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/junit.xml
          if-no-files-found: warn
